[project]
name = "newsletter-backend"
version = "0.1.0"
description = "Newsletter AI Backend Service"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.2",
    "fastapi>=0.122.0",
    "uvicorn[standard]>=0.38.0",
    "sqlalchemy>=2.0.44",
    "feedparser>=6.0.12",
    "anthropic>=0.75.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.1",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "httpx>=0.28.1",
    # LangChain for multi-model support
    "langchain>=1.1.0",
    "langchain-anthropic>=1.2.0",
    "langchain-openai>=1.1.0",
    "langchain-google-genai>=3.2.0",
    # Email delivery
    "resend>=2.19.0",
    "ruff>=0.14.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[build-system]
requires      = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.flake8]
max-line-length = 100

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "PIE",
    "SIM",
    "TID",
    "Q",
    "RUF",
]
ignore = ["BLE001", "E501", "N818"]

[tool.pylint.'MESSAGES CONTROL']
disable = ["broad-exception-caught"]
