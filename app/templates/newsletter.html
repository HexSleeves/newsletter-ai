<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ date }} Newsletter</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        border-bottom: 2px solid #e0e0e0;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }
      .article {
        margin-bottom: 30px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f9f9f9;
      }
      .article h3 {
        margin-top: 0;
        color: #2c3e50;
        font-size: 18px;
      }
      .article p {
        margin-bottom: 10px;
        color: #666;
      }
      .article-meta {
        font-size: 12px;
        color: #888;
        margin-bottom: 5px;
      }
      .footer {
        text-align: center;
        margin-top: 40px;
        color: #888;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>{{ date }} Newsletter</h1>
        <p>Your daily dose of curated news articles</p>
      </div>

      {% for article in articles %}
      <div class="article">
        <h3>
          <a href="{{ article.url }}" target="_blank">{{ article.title }}</a>
        </h3>
        <p>{{ article.summary | safe }}</p>
        <div class="article-meta">
          Source: {{ article.source }} | Published: {{
          article.published_at.strftime('%B %d, %Y') }}
        </div>
      </div>
      {% endfor %}

      <div class="footer">
        <p>Generated by Newsletter AI | {{ date }}</p>
      </div>
    </div>
  </body>
</html>
